---
layout: default
---
<article class="post">
  <header class="post-header">
    <a class="back-link" href="{{ '/' | relative_url }}">← 全部文章</a>
    <div class="post-meta"><time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: '%Y 年 %m 月 %d 日' }}</time><span>技术复盘</span></div>
    <h1>{{ page.title | escape }}</h1>
    {% if page.description %}<p class="post-description">{{ page.description }}</p>{% endif %}
    {% if page.tags %}<div class="tags" aria-label="文章标签">{% for tag in page.tags %}<span>{{ tag }}</span>{% endfor %}</div>{% endif %}
  </header>
  <div class="prose">{{ content }}</div>
  <footer class="post-footer"><a href="{{ '/' | relative_url }}">← 返回文章列表</a></footer>
</article>
