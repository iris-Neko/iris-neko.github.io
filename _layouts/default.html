<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>{% if page.title %}{{ page.title | escape }} · {% endif %}{{ site.title | escape }}</title>
  <meta name="description" content="{{ page.description | default: site.description | escape }}">
  <link rel="canonical" href="{{ page.url | absolute_url }}">
  <meta property="og:type" content="{% if page.layout == 'post' %}article{% else %}website{% endif %}">
  <meta property="og:title" content="{{ page.title | default: site.title | escape }}">
  <meta property="og:description" content="{{ page.description | default: site.description | escape }}">
  <meta property="og:url" content="{{ page.url | absolute_url }}">
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
</head>
<body>
  <a class="skip-link" href="#main">跳转到正文</a>
  <header class="site-header">
    <a class="brand" href="{{ '/' | relative_url }}"><span class="brand-mark" aria-hidden="true">N</span><span>iris-Neko<span class="brand-subtitle">技术笔记</span></span></a>
    <nav aria-label="主导航"><a href="{{ '/' | relative_url }}">文章</a><a href="https://github.com/iris-Neko/iris-neko.github.io" rel="me">GitHub ↗</a></nav>
  </header>
  <main id="main" class="main-content">{{ content }}</main>
  <footer class="site-footer"><span>iris-Neko · 技术笔记</span><span>以证据为依据，记录可复用的方法。</span></footer>
</body>
</html>
